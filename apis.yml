aid: mytra
name: Mytra
description: 'Mytra, Inc. is a Brisbane, California robotics company founded in 2022
  by former Tesla robotics lead Chris Walti, building what it calls software-defined
  warehousing: a three-part system of low-profile MytraBots that travel in X, Y and
  Z through a modular steel "cell" matrix up to 80 feet tall, and an AI-driven operating
  system that plans routes, resolves conflicts and dynamically reconfigures the matrix
  to store and retrieve anything from cases to full 3,000 lb pallets. The company raised
  a $120M Series C led by Avenir Growth in January 2026 (roughly $200M total) and sells
  the system as installed industrial infrastructure to enterprise distribution and
  food-and-beverage operators. Mytra publishes no developer program, no public API,
  and no machine-readable API contract.'
